# ADR-142: the whole regression, on every push and pull request. It reports beside the Pages deploy
# (pages.yml) and does not gate it: a failure here is a signal to fix, not a held-back release.
name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer push holds everything an older one did: the older run is cancelled, not queued.
  group: verify-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements-browser.txt
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -r tests/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build, all regressions, v2/v3/IR and Python parser contracts, pinned runtime hashes and publication audit
        run: npm run check:all
      - name: Generated contracts and browser outputs match their sources
        run: git diff --exit-code -- dist public/app public/samples/typescript src/core/schema-check.ts
      - name: Real HTTP, Pages, Python Node/worker parity and supplementary offline Chromium suites
        run: npm run test:browser:all
      - name: Retain browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: test-results/
          if-no-files-found: ignore
